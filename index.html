<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rewards UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Insérer le CSS ici ou dans un fichier séparé */
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="header-section">
            <div class="ribbon-container">
                <div class="ribbon">Daily Rewards</div>
                <div class="ribbon-ends"></div>
            </div>
            
            <div class="timer-label">Expires in:</div>
            <div class="timer-pill">
                <span class="clock-icon">⏰</span> 8h 59m 30s
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar-bg">
                <div class="progress-fill" style="width: 20%;"></div>
            </div>
            
            <div class="milestones">
                <div class="milestone completed">
                    <div class="chest-icon tier-1">📦</div> <div class="milestone-badge">✓</div>
                </div>
                <div class="milestone">
                    <div class="chest-icon tier-2">🎁</div>
                    <div class="milestone-badge">15</div>
                </div>
                <div class="milestone">
                    <div class="chest-icon tier-3">🎁</div>
                    <div class="milestone-badge">22</div>
                </div>
                <div class="milestone">
                    <div class="chest-icon tier-4">🎁</div>
                    <div class="milestone-badge">28</div>
                </div>
            </div>
        </div>

        <div class="days-grid">
            
            <div class="card day-card claimed">
                <div class="card-header">Day 1</div>
                <div class="card-content">
                    <div class="reward-icon coins-grey">🪙</div>
                </div>
                <div class="claimed-banner">Claimed</div>
            </div>

            <div class="card day-card today">
                <div class="card-header">Today</div>
                <div class="card-content">
                    <div class="reward-icon coins-gold">🪙</div>
                    <div class="amount">x500</div>
                </div>
                <div class="glow-effect"></div>
            </div>

            <div class="card day-card">
                <div class="card-header">Day 3</div>
                <div class="card-content">
                    <div class="reward-icon coins-gold">🪙</div>
                    <div class="amount">x500</div>
                </div>
            </div>

            <div class="card day-card">
                <div class="card-header">Day 4</div>
                <div class="card-content">
                    <div class="reward-icon hourglass">⏳</div>
                    <div class="amount">+10s</div>
                </div>
            </div>

            <div class="card day-card">
                <div class="card-header">Day 5</div>
                <div class="card-content">
                    <div class="reward-icon coins-gold">🪙</div>
                    <div class="amount">x800</div>
                </div>
            </div>

            <div class="card day-card">
                <div class="card-header">Day 6</div>
                <div class="card-content">
                    <div class="reward-icon hourglass">⏳</div>
                    <div class="amount">+30s</div>
                </div>
            </div>
        </div>

        <div class="card day-7-card">
            <div class="card-header">Day 7</div>
            <div class="day-7-content">
                <div class="reward-item">
                    <div class="reward-icon coins-gold">🪙</div>
                    <div class="amount">x1,000</div>
                </div>
                <div class="reward-item main-chest">
                    <div class="reward-icon mystery-box">🟪</div>
                    <div class="amount">x2</div>
                </div>
                <div class="reward-item">
                    <div class="reward-icon hourglass">⏳</div>
                    <div class="amount">+2m</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
