<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Gaming Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f1115;       /* Fond très sombre */
            --card-surface: #1b1e26;  /* Fond des cartes */
            --primary: #00d2ff;       /* Bleu Cyan Néon */
            --primary-glow: rgba(0, 210, 255, 0.4);
            --accent-purple: #7d5fff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --gold: #ffc107;
            --success: #00e676;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'Exo 2', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- UI FRAME --- */
        .game-frame {
            width: 100%;
            max-width: 400px;
            height: 95vh;
            max-height: 850px;
            background-color: var(--bg-dark);
            border-radius: 16px;
            /* Bordure subtile brillante */
            border: 1px solid #2a2e38;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- HEADER --- */
        .header {
            padding: 25px 20px;
            background: linear-gradient(180deg, rgba(27,30,38,1) 0%, rgba(15,17,21,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-main);
            /* Petit détail tech */
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .close-btn {
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { color: white; }

        /* --- LIST CONTAINER --- */
        .reward-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- REWARD CARD (ROW) --- */
        .card {
            background-color: var(--card-surface);
            border-radius: 8px;
            padding: 0 15px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
            position: relative;
        }

        /* Partie Gauche */
        .card-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .day-box {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 5px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            width: 50px;
            text-align: center;
        }

        .card-info {
            display: flex;
            flex-direction: column;
        }
        .item-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
        }
        .item-sub {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Partie Droite (Icone/Bouton) */
        .card-right {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
        }

        /* --- ÉTATS --- */

        /* 1. CLAIMED (Grisé + Vert) */
        .card.claimed {
            opacity: 0.6;
            background: rgba(0, 230, 118, 0.05); /* Teinte verte très légère */
            border-color: rgba(0, 230, 118, 0.2);
        }
        .card.claimed .day-box { color: var(--success); border: 1px solid var(--success); background: transparent;}
        .check-icon { color: var(--success); font-size: 18px; }

        /* 2. ACTIVE (Focus + Glow) */
        .card.active {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.1) 0%, transparent 100%);
            border: 1px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1); /* Glow bleu */
            transform: scale(1.02);
            z-index: 2;
        }
        .card.active .day-box {
            background: var(--primary);
            color: #000;
            font-weight: 900;
        }
        .card.active .item-name { color: var(--primary); }
        
        .claim-btn-small {
            background: var(--primary);
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-glow);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .claim-btn-small:hover { background: white; }

        /* 3. LOCKED */
        .card.locked {
            opacity: 0.8;
        }
        .lock-icon { color: #444; font-size: 16px; }

        /* 4. GRAND PRIX (Day 7) */
        .card.grand-prize {
            height: 90px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.1) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--gold);
        }
        .card.grand-prize .day-box {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .gold-icon { font-size: 24px; color: var(--gold); filter: drop-shadow(0 0 5px var(--gold)); }

        /* --- FOOTER --- */
        .footer {
            padding: 20px;
            background: var(--bg-dark);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--accent-purple) 0%, var(--primary) 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        /* Petit effet brillance sur le bouton */
        .main-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        .main-btn:hover::before { left: 150%; }

    </style>
</head>
<body>

    <div class="game-frame">
        
        <div class="header">
            <h1>Daily Login</h1>
            <i class="fa-solid fa-xmark close-btn"></i>
        </div>

        <div class="reward-list">

            <div class="card claimed">
                <div class="card-left">
                    <div class="day-box"><i class="fa-solid fa-check"></i></div>
                    <div class="card-info">
                        <span class="item-name">100 Coins</span>
                        <span class="item-sub">Claimed</span>
                    </div>
                </div>
                <div class="card-right">
                    <i class="fa-solid fa-check-circle check-icon"></i>
                </div>
            </div>

            <div class="card active
