<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Offer UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Variables de couleurs et styles de base --- */
        :root {
            --bg-app-dark: #1a1a2e; /* Fond d'écran simulant l'app */
            --modal-bg-top: #4a4e8a;
            --modal-bg-bottom: #3b3f78;
            --card-bg-locked: #5c5f8a;
            --card-bg-active: #353a85;
            --card-bg-claimed: #4a4a6a;
            --text-white: #ffffff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-pink: #d6308c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-app-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Conteneur principal de la modale --- */
        .modal-container {
            width: 90%;
            max-width: 360px; /* Largeur typique de mobile */
            background: linear-gradient(to bottom, var(--modal-bg-top), var(--modal-bg-bottom));
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: var(--text-white);
            position: relative;
        }

        /* --- Header (Icônes X et ?) --- */
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .header i { cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .header i:hover { opacity: 1; }

        /* --- Titre "Welcome Offer" --- */
        .title {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 25px;
            /* Simulation du contour noir épais */
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000, 
                2px -2px 0 #000, -2px 2px 0 #000,
                0px 4px 5px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        /* --- Grille des jours 1 à 6 --- */
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colonnes égales */
            gap: 12px;
            margin-bottom: 15px;
        }

        /* --- Styles des cartes (Jour 1-6) --- */
        .card {
            background-color: var(--card-bg-locked);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 110px;
        }

        /* En-tête de la carte (ex: "Day 1") */
        .card-header {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.8;
        }
        .card-header i { font-size: 12px; } /* Taille de l'icône cadenas */

        /* Contenu de la carte (Icône + Montant) */
        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Style de l'icône pièce dorée */
        .coin-icon {
            font-size: 28px;
            color: var(--accent-gold);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
            margin-bottom: 5px;
        }

        /* Style du montant (+20) */
        .amount {
            font-size: 24px;
            font-weight: 800;
            font-style: italic;
        }

        /* --- États spécifiques des cartes --- */

        /* État : Réclamé (Day 1) */
        .card.claimed {
            background-color: var(--card-bg-claimed);
            opacity: 0.8;
        }
        .check-icon {
            font-size: 32px;
            color: var(--accent-green);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
            margin-bottom: 5px;
        }
        /* Symbole "C" rose */
        .currency-c {
            display: inline-block;
            background-color: var(--accent-pink);
            width: 18px; height: 18px;
            border-radius: 50%;
            font-size: 12px; font-weight: bold; font-style: normal;
            line-height: 18px; text-align: center;
            margin-left: 2px; vertical-align: middle;
        }

        /* État : Actif (Day 2) */
        .card.active {
            background-color: var(--card-bg-active);
            box-shadow: 0 0 15px rgba(53, 58, 133, 0.5); /* Légère lueur */
            z-index: 2; /* Pour passer au-dessus des autres si besoin */
        }
        /* Badge Timer rouge */
        .timer-badge {
            position: absolute;
            bottom: -10px; /* Chevauchement du bas */
            background-color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px; font-weight: 800;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* État : Verrouillé (Day 3-6) */
        .card.locked {
            /* Utilise la couleur de base */
        }

        /* --- Bannière Jour 7 --- */
        .day-7-banner {
            background-color: var(--card-bg-locked);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .day-7-text {
            font-size: 18px; font-weight: 800; font-style: italic;
            margin-top: 5px; line-height: 1.2;
        }
        .day-7-subtext {
            font-size: 14px; font-weight: 600; font-style: italic;
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="modal-container">
        <div class="header">
            <i class="fa-solid fa-xmark"></i>
            <i class="fa-regular fa-circle-question"></i>
        </div>

        <div class="title">Welcome Offer</div>

        <div class="rewards-grid">
            <div class="card claimed">
                <div class="card-header">Day 1</div>
                <div class="card-body">
                    <i class="fa-solid fa-circle-check check-icon"></i>
                    <div class="amount">+20<span class="currency-c">C</span></div>
                </div>
            </div>

            <div class="card active">
                <div class="card-header">
                    <i class="fa-solid fa-lock-open"></i> Day 2
                </div>
                <div class="card-body">
                    <i class="fa-solid fa-coins coin-icon"></i>
                    <div class="amount">+20</div>
                </div>
                <div class="timer-badge">23:16:20</div>
            </div>

            <div class="card locked">
                <div class="card-header">
                    <i class="fa-solid fa-lock"></i> Day 3
                </div>
                <div class="card-body">
                    <i class="fa-solid fa-coins coin-icon"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card locked">
                <div class="card-header">
                    <i class="fa-solid fa-lock"></i> Day 4
                </div>
                <div class="card-body">
                    <i class="fa-solid fa-coins coin-icon"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card locked">
                <div class="card-header">
                    <i class="fa-solid fa-lock"></i> Day 5
                </div>
                <div class="card-body">
                    <i class="fa-solid fa-coins coin-icon"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card locked">
                <div class="card-header">
                    <i class="fa-solid fa-lock"></i> Day 6
                </div>
                <div class="card-body">
                    <i class="fa-solid fa-coins coin-icon"></i>
                    <div class="amount">+20</div>
                </div>
            </div>
        </div>

        <div class="day-7-banner">
            <div class="card-header">
                <i class="fa-solid fa-lock"></i> Day 7
            </div>
            <div class="day-7-text">
                Extra reward<br>
                <span class="day-7-subtext">if you unlock every day</span>
            </div>
        </div>

    </div>

</body>
</html>
