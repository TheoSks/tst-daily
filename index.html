<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Gaming Reward UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Palette "Mythic" */
            --primary-orange: #ff9f0f;
            --primary-shadow: #c65d00;
            --stone-light: #637b94;
            --stone-dark: #2c3e50;
            --gold-shine: #ffeaa7;
            --gold-base: #f1c40f;
            --gold-shadow: #b7791f;
            --btn-green-top: #9cec38;
            --btn-green-bot: #58b300;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at center, #2e1c05 0%, #000 100%);
            font-family: 'Titan One', cursive;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- LE TEMPLE (Container) --- */
        .modal-frame {
            width: 95%;
            max-width: 420px;
            background: linear-gradient(to bottom, var(--primary-orange), var(--primary-shadow));
            border-radius: 24px;
            padding: 8px; /* Bordure extérieure orange */
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-inner {
            background: #4a2c0f; /* Fond sombre intérieur */
            border-radius: 18px;
            border: 4px solid #3d2207;
            padding: 20px 15px;
            position: relative;
            /* Motif de fond subtil */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 10px, transparent 10px, transparent 20px);
        }

        /* Colonnes décoratives CSS */
        .pillar {
            position: absolute;
            top: 20px; bottom: 20px; width: 14px;
            background: linear-gradient(90deg, #d38d38, #ffdd94, #a3621a);
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .pillar.left { left: -6px; }
        .pillar.right { right: -6px; }

        /* Chapiteaux des colonnes */
        .pillar::before, .pillar::after {
            content: ''; position: absolute; left: -4px; width: 22px; height: 12px;
            background: linear-gradient(to bottom, #ffeaa7, #b7791f);
            border-radius: 4px; border: 1px solid #754608;
        }
        .pillar::before { top: -10px; }
        .pillar::after { bottom: -10px; }


        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 20;
        }

        .title-ribbon {
            background: linear-gradient(to bottom, #ff4757, #c0392b);
            display: inline-block;
            padding: 10px 30px;
            transform: skew(-5deg) rotate(-2deg);
            border: 3px solid #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .title-text {
            color: white;
            font-size: 26px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000;
            -webkit-text-stroke: 1.5px black;
            margin: 0;
            transform: skew(5deg); /* Annule le skew du parent */
        }

        .close-btn {
            position: absolute;
            top: -25px; right: -10px;
            width: 40px; height: 40px;
            background: linear-gradient(#e74c3c, #c0392b);
            border: 3px solid #fff;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #7f0000;
            z-index: 30;
        }
        .close-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- GRID SYSTEM --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        /* --- CARTE GÉNÉRIQUE (Look Pierre 3D) --- */
        .slot {
            background-color: var(--stone-dark);
            height: 100px;
            border-radius: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* Effet Bloc 3D (Bevel) */
            border-top: 4px solid var(--stone-light);
            border-left: 2px solid var(--stone-light);
            border-right: 2px solid #1a252f;
            border-bottom: 6px solid #151e26;
            box-shadow: 0 4px 5px rgba(0,0,0,0.3);
        }

        /* Étiquette du jour */
        .day-tag {
            position: absolute;
            top: -10px;
            background: #222;
            color: #ccc;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #555;
            z-index: 5;
        }

        .slot-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-img {
            font-size: 32px;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.3));
            margin-bottom: 5px;
            transition: transform 0.2s;
        }

        .amount-txt {
            font-size: 16px;
            color: white;
            -webkit-text-stroke: 1px black;
            text-shadow: 0 2px 0 black;
        }

        /* --- ÉTATS SPÉCIFIQUES --- */

        /* 1. CLAIMED (Vert enfoncé) */
        .slot.claimed {
            background-color: #243526;
            border-top: 2px solid #1e2b1f; /* Moins de relief */
            border-bottom: 2px solid #2ecc71; /* Highlight inversé */
            opacity: 0.8;
        }
        .slot.claimed .icon-img { opacity: 0.4; }
        .stamp-check {
            position: absolute;
            color: #2ecc71;
            font-size: 36px;
            text-shadow: 0 3px 0 #004d1a;
            z-index: 10;
            transform: rotate(-10deg);
        }

        /* 2. ACTIVE (Hero Card) */
        .slot.active {
            background: radial-gradient(circle, #3498db 0%, #2980b9 100%);
            border-color: #5dade2;
            border-bottom-color: #1f618d;
            overflow: hidden; /* Pour les rayons */
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.6);
            border: 2px solid #fff; /* Bordure blanche sélection */
        }
        
        .slot.active .day-tag {
            background: #e74c3c;
            color: white;
            border-color: #c0392b;
            font-weight: bold;
        }

        /* Rayons de lumière tournants */
        .god-rays {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.15) 0deg 20deg, transparent 20deg 40deg);
            animation: spin 8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Le timer digital */
        .timer-badge {
            position: absolute;
            bottom: -8px;
            background: #333;
            color: #4cd137; /* Vert digital */
            font-family: monospace;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 2px solid #fff;
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        /* 3. DAY 7 (Légendaire) */
        .slot.legendary {
            grid-column: span 3;
            height: 120px;
            background: radial-gradient(circle, #9b59b6 0%, #8e44ad 100%);
            border-top: 4px solid #d2b4de;
            border-bottom: 6px solid #4a235a;
            border-left: 2px solid #8e44ad;
            border-right: 2px solid #8e44ad;
            /* Bordure dorée externe */
            outline: 3px solid var(--gold-base);
            outline-offset: -3px;
            
            flex-direction: row;
            justify-content: space-between;
            padding: 0 20px;
        }
        
        .legendary-info { text-align: left; z-index: 2;}
        .legendary-title { color: var(--gold-shine); font-size: 18px; text-shadow: 1px 1px 0 #000; margin-bottom: 2px;}
        .legendary-sub { font-size: 12px; color: #e1bee7; }

        .chest-container {
            position: relative;
            z-index: 2;
        }
        .chest-icon {
            font-size: 50px;
            color: var(--gold-base);
            filter: drop-shadow(0 5px 0 #b7791f);
            animation: bounce 2s infinite ease-in-out;
        }
        .chest-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.6) 0%, transparent 70%);
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes pulseGlow { from { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } }

        /* --- BUTTON --- */
        .btn-claim {
            width: 100%;
            background: linear-gradient(to bottom, var(--btn-green-top), var(--btn-green-bot));
            border: none;
            border-radius: 12px;
            padding: 18px;
            color: white;
            font-family: 'Titan One', cursive;
            font-size: 24px;
            text-transform: uppercase;
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            -webkit-text-stroke: 1px #285200;
            
            /* Effet 3D Bouton */
            box-shadow: 
                0 6px 0 #3b7a00, /* Côté du bouton */
                0 12px 10px rgba(0,0,0,0.3); /* Ombre portée */
            
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Reflet brillant sur le bouton */
        .btn-claim::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
            border-radius: 12px 12px 60% 60% / 12px 12px 20px 20px;
        }

        .btn-claim:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #3b7a00, inset 0 2px 5px rgba(0,0,0,0.4);
        }

    </style>
</head>
<body>

    <div class="modal-frame">
        <div class="close-btn"><i class="fa-solid fa-xmark"></i></div>
        
        <div class="pillar left"></div>
        <div class="pillar right"></div>

        <div class="modal-inner">
            
            <div class="header">
                <div class="title-ribbon">
                    <h1 class="title-text">Welcome Offer</h1>
                </div>
            </div>

            <div class="grid-container">
                
                <div class="slot claimed">
                    <div class="day-tag" style="background:#145224; border-color:#2ecc71; color:#fff;">JOUR 1</div>
                    <div class="stamp-check"><i class="fa-solid fa-check"></i></div>
                    <i class="fa-solid fa-coins icon-img"></i>
                    <div class="amount-txt">20 OR</div>
                </div>

                <div class="slot active">
                    <div class="god-rays"></div>
                    <div class="day-tag">JOUR 2</div>
                    <i class="fa-solid fa-gem icon-img" style="color: #6edbff;"></i>
                    <div class="amount-txt">+10</div>
                    <div class="timer-badge">23:15:40</div>
                </div>

                <div class="slot">
                    <div class="day-tag">JOUR 3</div>
                    <i class="fa-solid fa-scroll icon-img" style="color:#bdc3c7; opacity:0.5;"></i>
                    <div class="amount-txt" style="color:#95a5a6;">RARE</div>
                    <i class="fa-solid fa-lock" style="position:absolute; top:5px; right:5px; color:#555;"></i>
                </div>

                <div class="slot">
                    <div class="day-tag">JOUR 4</div>
                    <i class="fa-solid fa-shield-halved icon-img" style="color:#bdc3c7; opacity:0.5;"></i>
                    <div class="amount-txt" style="color:#95a5a6;">+50</div>
                    <i class="fa-solid fa-lock" style="position:absolute; top:5px; right:5px; color:#555;"></i>
                </div>

                <div class="slot">
                    <div class="day-tag">JOUR 5</div>
                    <i class="fa-solid fa-bolt icon-img" style="color:#bdc3c7; opacity:0.5;"></i>
                    <div class="amount-txt" style="color:#95a5a6;">NRJ</div>
                    <i class="fa-solid fa-lock" style="position:absolute; top:5px; right:5px; color:#555;"></i>
                </div>

                <div class="slot">
                    <div class="day-tag">JOUR 6</div>
                    <i class="fa-solid fa-khanda icon-img" style="color:#bdc3c7; opacity:0.5;"></i>
                    <div class="amount-txt" style="color:#95a5a6;">ÉPÉE</div>
                    <i class="fa-solid fa-lock" style="position:absolute; top:5px; right:5px; color:#555;"></i>
                </div>

                <div class="slot legendary">
                    <div class="legendary-info">
                        <div class="day-tag" style="background:#f1c40f; color:#4a2c0f; font-weight:900; border:none; top:-12px;">JOUR 7</div>
                        <div class="legendary-title">COFFRE FINAL</div>
                        <div class="legendary-sub">Récompense Épique !</div>
                    </div>
                    <div class="chest-container">
                        <div class="chest-glow"></div>
                        <i class="fa-solid fa-trophy chest-icon"></i>
                    </div>
                    <i class="fa-solid fa-lock" style="position:absolute; bottom:5px; right:5px; color:rgba(0,0,0,0.3);"></i>
                </div>

            </div>

            <button class="btn-claim">RÉCUPÉRER</button>

        </div>
    </div>

</body>
</html>
