<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Welcome Offer</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-bg: #1e1e2f;
            --modal-gradient: linear-gradient(160deg, #4b5294 0%, #363b6e 100%);
            --card-inactive: rgba(30, 30, 50, 0.5);
            --card-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #5d6afb;
            --neon-gold: #ffce00;
            --neon-green: #00ff88;
            --timer-red: #ff4757;
            --text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f13;
            background-image: radial-gradient(circle at 50% 10%, #2a2a40 0%, #0f0f13 70%);
            font-family: 'Kanit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* --- MODALE --- */
        .offer-modal {
            width: 90%;
            max-width: 400px;
            background: var(--modal-gradient);
            border-radius: 30px;
            padding: 24px;
            position: relative;
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.1) inset, /* Bordure interne subtile */
                0 20px 50px rgba(0,0,0,0.6),
                0 0 100px rgba(75, 82, 148, 0.3); /* Glow externe */
            border: 1px solid rgba(255,255,255,0.15);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- HEADER --- */
        .header-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .icon-btn:active { transform: scale(0.9); }

        .title-container {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .main-title {
            font-size: 42px;
            line-height: 1;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d1d5e6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 0px #000);
            transform: rotate(-2deg);
        }

        /* --- GRID --- */
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* --- CARTE BASE --- */
        .card {
            background: var(--card-inactive);
            border-radius: 16px;
            height: 120px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--card-border);
            /* Glassmorphism subtil */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .card-top {
            width: 100%;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .coin {
            font-size: 24px;
            color: var(--neon-gold);
            filter: drop-shadow(0 0 10px rgba(255, 206, 0, 0.4));
            margin-bottom: 5px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }

        .amount {
            font-weight: 900;
            font-style: italic;
            font-size: 22px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- VARIATIONS DES CARTES --- */

        /* 1. CLAIMED (Validé) */
        .card.claimed {
            background: rgba(0, 0, 0, 0.2);
            border-color: transparent;
        }
        .card.claimed .card-top { color: #888; }
        .card.claimed .amount { color: #888; text-shadow: none; }
        
        .check-badge {
            width: 32px;
            height: 32px;
            background: var(--neon-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            font-size: 16px;
            color: #004d29;
            margin-bottom: 4px;
        }

        /* 2. ACTIVE (Le jour actuel) */
        .card.active {
            background: linear-gradient(180deg, rgba(80, 90, 160, 0.8) 0%, rgba(60, 70, 130, 0.9) 100%);
            border: 1px solid rgba(255,255,255,0.4);
            overflow: visible; /* Pour le timer qui dépasse */
            animation: pulseBorder 2s infinite;
        }

        @keyframes pulseBorder {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .card.active .card-top {
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .timer-pill {
            position: absolute;
            bottom: -10px;
            background: var(--timer-red);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #2b2b3d; /* Bordure qui match le fond */
            min-width: 60px;
            text-align: center;
        }

        /* 3. LOCKED */
        .card.locked {
            opacity: 0.7;
        }
        .card.locked i { color: #8892b0; filter: none; animation: none;}

        /* 4. DAY 7 (Special) */
        .card.wide {
            grid-column: span 3;
            height: auto;
            padding: 15px;
            margin-top: 10px;
            /* Gradient Or subtil */
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 140, 0, 0.05) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        
        .card.wide .card-top {
            width: auto;
            border: none;
            padding: 0;
            margin-right: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: var(--neon-gold);
        }

        .wide-text {
            text-align: right;
            flex: 1;
        }
        .wide-title {
            display: block;
            font-size: 16px;
            font-weight: 800;
            font-style: italic;
            color: white;
        }
        .wide-sub {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }

        /* Lock Icon Positioning */
        .lock-icon { font-size: 10px; margin-right: 4px; }

    </style>
</head>
<body>

    <div class="offer-modal">
        <div class="header-actions">
            <div class="icon-btn"><i class="fa-solid fa-xmark"></i></div>
            <div class="icon-btn"><i class="fa-solid fa-question"></i></div>
        </div>

        <div class="title-container">
            <div class="main-title">Welcome Offer</div>
        </div>

        <div class="rewards-grid">

            <div class="card claimed">
                <div class="card-top">Day 1</div>
                <div class="card-content">
                    <div class="check-badge"><i class="fa-solid fa-check"></i></div>
                    <div class="amount" style="font-size: 18px;">+20</div>
                </div>
            </div>

            <div class="card active">
                <div class="card-top">Day 2</div>
                <div class="card-content">
                    <i class="fa-solid fa-coins coin"></i>
                    <div class="amount">+20</div>
                </div>
                <div class="timer-pill" id="countdown">23:59:59</div>
            </div>

            <div class="card locked">
                <div class="card-top"><i class="fa-solid fa-lock lock-icon"></i> Day 3</div>
                <div class="card-content">
                    <i class="fa-solid fa-coins coin"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card locked">
                <div class="card-top"><i class="fa-solid fa-lock lock-icon"></i> Day 4</div>
                <div class="card-content">
                    <i class="fa-solid fa-coins coin"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card locked">
                <div class="card-top"><i class="fa-solid fa-lock lock-icon"></i> Day 5</div>
                <div class="card-content">
                    <i class="fa-solid fa-coins coin"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card locked">
                <div class="card-top"><i class="fa-solid fa-lock lock-icon"></i> Day 6</div>
                <div class="card-content">
                    <i class="fa-solid fa-coins coin"></i>
                    <div class="amount">+20</div>
                </div>
            </div>

            <div class="card wide">
                <div class="card-top">
                    <i class="fa-solid fa-lock" style="font-size:14px;"></i> 
                    <span style="font-weight:800; font-size:18px;">Day 7</span>
                </div>
                <div class="wide-text">
                    <span class="wide-title">Extra Reward</span>
                    <span class="wide-sub">Unlock all days to claim</span>
                </div>
                <i class="fa-solid fa-gift" style="font-size: 28px; color: var(--neon-gold); margin-left:10px;"></i>
            </div>

        </div>
    </div>

    <script>
        // Petit script pour animer le Timer
        function startTimer(duration, display) {
            var timer = duration, hours, minutes, seconds;
            setInterval(function () {
                hours = parseInt(timer / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = hours + ":" + minutes + ":" + seconds;

                if (--timer < 0) {
                    timer = duration;
                }
            }, 1000);
        }

        window.onload = function () {
            var twentyFourHours = 23 * 3600 + 16 * 60 + 20; // 23h 16m 20s
            var display = document.querySelector('#countdown');
            startTimer(twentyFourHours, display);
        };
    </script>
</body>
</html>
