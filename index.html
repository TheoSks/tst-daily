<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rewards Cartoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-app: #f0f4f8;
            --pink-container: #ffc2f5;
            --purple-card: #8c7ae6;
            --purple-dark: #644ec4;
            --lime-green: #b8ff45; /* Le vert "Active" et Bouton */
            --yellow-card: #fff200;
            --yellow-dark: #e1d200;
            --text-dark: #2d3436;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #dfe6e9;
            font-family: 'Nunito', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- MOBILE CONTAINER --- */
        .mobile-screen {
            width: 100%;
            max-width: 400px;
            height: 95vh;
            max-height: 880px;
            background-color: #edf2f7; /* Fond gris bleuté clair */
            border-radius: 40px;
            border: 8px solid #2d3436;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            padding-top: 40px;
            padding-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-family: 'Fredoka One', cursive;
            font-size: 38px;
            text-transform: uppercase;
            color: #00e600; /* Vert flashy */
            /* Contour noir épais + Ombre portée */
            -webkit-text-stroke: 1.5px black;
            text-shadow: 
                3px 3px 0 #000,
                0 0 20px rgba(0, 230, 0, 0.4);
            margin: 0;
            letter-spacing: 1px;
            transform: skew(-2deg);
        }

        /* Illustration Trophées (Simulée) */
        .trophy-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .trophy-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .trophy-icon {
            font-size: 30px;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1));
            margin-bottom: -5px;
            z-index: 2;
        }
        .podium-block {
            width: 40px;
            background: #a29bfe;
            border: 2px solid #6c5ce7;
            border-radius: 4px 4px 0 0;
        }

        /* --- GRID CONTAINER (LE ROSE) --- */
        .grid-wrapper {
            background-color: var(--pink-container);
            margin: 0 15px;
            border-radius: 20px;
            padding: 15px;
            flex: 1; /* Prend l'espace restant */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Espacer la grille */
            box-shadow: 0 8px 0 #fab1a0; /* Petite épaisseur rose foncé */
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* --- CARTE BASE --- */
        .card {
            border-radius: 12px;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* Ombre douce */
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* HEADER PILL (Day X) */
        .day-pill {
            width: 100%;
            text-align: center;
            padding: 5px 0;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 12px 12px 0 0; /* Arrondi haut seulement */
            color: rgba(0,0,0,0.5);
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 5px;
        }

        .reward-icon {
            font-size: 24px;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
        }

        .reward-amount {
            font-weight: 900;
            font-size: 13px;
        }

        /* --- VARIANTES --- */

        /* 1. CLAIMED (Violet) */
        .card.claimed {
            background-color: var(--purple-card);
            color: rgba(255,255,255,0.6);
        }
        .card.claimed .day-pill {
            background-color: rgba(0,0,0,0.1);
            color: rgba(255,255,255,0.7);
        }
        .card.claimed .reward-icon {
            opacity: 0.5;
        }
        /* Checkmark Vert géant */
        .check-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #00b894; /* Vert check */
            background: white;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            /* On masque le cercle blanc pour ne garder que l'icone si on veut, 
               mais ici je fais un style "Sticker" */
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .check-overlay i { font-size: 24px; }


        /* 2. ACTIVE (Vert Lime + Bordure) */
        .card.active {
            background-color: var(--lime-green);
            border: 3px solid var(--purple-dark); /* Bordure violette typique */
            color: var(--text-dark);
            transform: scale(1.02); /* Légèrement plus gros */
            z-index: 10;
        }
        .card.active .day-pill {
            background-color: var(--purple-card); /* Pill violette */
            color: white;
            margin: -1px -1px 0 -1px; /* Pour coller aux bords */
            width: calc(100% + 2px);
            border-radius: 9px 9px 0 0;
        }
        .card.active .reward-amount {
            font-size: 15px; /* Plus gros */
            color: black;
            text-shadow: 0 1px 0 white;
        }


        /* 3. LOCKED (Jaune) */
        .card.locked {
            background-color: var(--yellow-card);
            color: var(--text-dark);
        }
        .card.locked .day-pill {
            background-color: rgba(0,0,0,0.05);
            color: #b7a900;
            font-size: 10px;
        }
        .card.locked .reward-amount {
            color: #333;
        }

        /* 4. DAY 7 (Large + Sunburst) */
        .card.wide {
            grid-column: span 3;
            height: 100px;
            /* Sunburst effect simulé */
            background: repeating-conic-gradient(
                from 0deg,
                #ffd700 0deg 15deg,
                #ffca28 15deg 30deg
            );
            border: 2px solid #ffca28;
            flex-direction: column;
        }
        .card.wide .day-pill {
            background-color: rgba(0,0,0,0.1); /* Foncé */
            color: #795548;
        }
        .card.wide .card-content {
            flex-direction: row; /* Horizontal */
            gap: 15px;
        }
        
        .plus-sign {
            font-family: 'Fredoka One', cursive;
            font-size: 30px;
            color: white;
            text-shadow: 2px 2px 0 #d35400; /* Ombre orange */
            -webkit-text-stroke: 1px #d35400;
        }

        .wide-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* --- FOOTER SECTION --- */
        .footer-section {
            padding: 20px;
            text-align: center;
        }

        .claim-btn {
            width: 100%;
            background-color: var(--lime-green);
            border: 2px solid black;
            border-radius: 50px; /* Pill shape */
            padding: 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: black;
            cursor: pointer;
            box-shadow: 0 5px 0 black; /* Ombre dure cartoon */
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.1s;
        }
        .claim-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 black;
        }

        .timer-text {
            font-size: 12px;
            color: #636e72;
            font-weight: 700;
        }

    </style>
</head>
<body>

    <div class="mobile-screen">
        
        <div class="header">
            <h1 class="main-title">Daily Rewards</h1>
            
            <div class="trophy-stage">
                <div class="trophy-col">
                    <i class="fa-solid fa-trophy trophy-icon" style="color:#bdc3c7; font-size:24px;"></i>
                    <div class="podium-block" style="height:20px; background:#a29bfe;"></div>
                </div>
                <div class="trophy-col">
                    <i class="fa-solid fa-trophy trophy-icon" style="color:#f1c40f; font-size:36px;"></i>
                    <div class="podium-block" style="height:35px; background:#6c5ce7; border-color:#4834d4;"></div>
                </div>
                <div class="trophy-col">
                    <i class="fa-solid fa-trophy trophy-icon" style="color:#e67e22; font-size:24px;"></i>
                    <div class="podium-block" style="height:15px; background:#a29bfe;"></div>
                </div>
            </div>
        </div>

        <div class="grid-wrapper">
            <div class="rewards-grid">
                
                <div class="card claimed">
                    <div class="day-pill">Day 1</div>
                    <div class="card-content">
                        <i class="fa-solid fa-coins reward-icon" style="color:#a29bfe;"></i>
                        <span class="reward-amount">100 ME</span>
                        <div class="check-overlay"><i class="fa-solid fa-check" style="color:#00b894; font-size:18px;"></i></div>
                    </div>
                </div>

                <div class="card claimed">
                    <div class="day-pill">Day 2</div>
                    <div class="card-content">
                        <i class="fa-solid fa-ticket reward-icon" style="color:#a29bfe;"></i>
                        <span class="reward-amount">320 RP</span>
                        <div class="check-overlay"><i class="fa-solid fa-check" style="color:#00b894; font-size:18px;"></i></div>
                    </div>
                </div>

                <div class="card active">
                    <div class="day-pill">Day 3</div>
                    <div class="card-content">
                        <i class="fa-brands fa-bitcoin reward-icon" style="color:white; font-size:32px; filter:drop-shadow(0 2px 0 rgba(0,0,0,0.2));"></i>
                        <span class="reward-amount">250 ME</span>
                    </div>
                </div>

                <div class="card locked">
                    <div class="day-pill"><i class="fa-solid fa-lock"></i> Day 4</div>
                    <div class="card-content">
                        <i class="fa-solid fa-gift reward-icon" style="color:#e17055;"></i>
                        <span class="reward-amount">Gift Card</span>
                    </div>
                </div>

                <div class="card locked">
                    <div class="day-pill"><i class="fa-solid fa-lock"></i> Day 5</div>
                    <div class="card-content">
                        <i class="fa-solid fa-box-open reward-icon" style="color:#e67e22;"></i>
                        <span class="reward-amount">Surprise</span>
                    </div>
                </div>

                <div class="card locked">
                    <div class="day-pill"><i class="fa-solid fa-lock"></i> Day 6</div>
                    <div class="card-content">
                        <i class="fa-brands fa-bitcoin reward-icon" style="color:#f1c40f;"></i>
                        <span class="reward-amount">500 ME</span>
                    </div>
                </div>

                <div class="card wide">
                    <div class="day-pill"><i class="fa-solid fa-lock"></i> Day 7</div>
                    <div class="card-content">
                        <div class="wide-item">
                            <i class="fa-brands fa-bitcoin reward-icon" style="color:#fff; font-size:28px;"></i>
                            <span class="reward-amount" style="color:#5d4037;">500 ME</span>
                        </div>
                        
                        <div class="plus-sign">+</div>

                        <div class="wide-item">
                            <i class="fa-solid fa-ticket reward-icon" style="color:#00b894; font-size:28px;"></i>
                            <span class="reward-amount" style="color:#5d4037;">1200 RP</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="footer-section">
            <button class="claim-btn">
                Claim Your Reward <i class="fa-solid fa-chevron-right"></i>
            </button>
            <div class="timer-text">Your next reward unlocks in 22 hours and 15 minutes!</div>
        </div>

    </div>

</body>
</html>
