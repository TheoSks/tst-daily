<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rewards Cartoon Vertical</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Palette Cartoon */
            --bg-app: #eef2f7;
            --primary-blue: #4facfe;
            --primary-blue-dark: #00f2fe;
            --accent-gold: #ffb300;
            --accent-green: #2ecc71;
            --text-dark: #2c3e50;
            --text-light: #ffffff;
            --card-bg: #ffffff;
            --locked-gray: #dfe6e9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #dcdde1;
            font-family: 'Nunito', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CADRE MOBILE --- */
        .mobile-frame {
            width: 100%;
            max-width: 400px;
            height: 95vh;
            max-height: 850px;
            background-color: var(--bg-app);
            border-radius: 30px;
            /* Bordure épaisse style cartoon */
            border: 6px solid var(--text-dark);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- HEADER --- */
        .header {
            /* Dégradé sympa */
            background: linear-gradient(to right, var(--primary-blue), var(--primary-blue-dark));
            padding: 30px 20px;
            text-align: center;
            color: var(--text-light);
            border-bottom: 6px solid var(--text-dark);
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* Contour texte cartoon */
            text-shadow: 2px 2px 0 var(--text-dark);
        }
        .header p {
            margin: 5px 0 0 0;
            font-weight: 600;
            opacity: 0.9;
        }

        /* --- LISTE VERTICALE --- */
        .reward-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Masquer la scrollbar */
            scrollbar-width: none;
        }
        .reward-list::-webkit-scrollbar { display: none; }

        /* --- CARTE CADEAU (ROW) --- */
        .reward-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* Ombre portée douce et bordure */
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
            border: 3px solid transparent;
            transition: all 0.2s;
            position: relative;
        }

        /* Partie Gauche : Info Jour */
        .card-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 80px;
        }
        .day-title {
            font-weight: 900;
            font-size: 18px;
            color: var(--text-dark);
        }
        .day-status {
            font-size: 12px;
            font-weight: 700;
            color: #95a5a6;
            background: #ecf0f1;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }

        /* Partie Centrale : Récompense */
        .card-reward {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }
        .reward-icon {
            font-size: 32px;
            filter: drop-shadow(0 3px 0 rgba(0,0,0,0.1));
        }
        .reward-amount {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-dark);
        }

        /* Partie Droite : État */
        .card-state {
            min-width: 40px;
            display: flex;
            justify-content: flex-end;
        }

        /* --- ÉTATS SPÉCIFIQUES --- */

        /* 1. RÉCUPÉRÉ (Claimed) */
        .reward-card.claimed {
            background-color: #ecf0f1;
            opacity: 0.8;
        }
        .reward-card.claimed .day-status {
            background: var(--accent-green);
            color: white;
        }
        .check-icon {
            color: var(--accent-green);
            font-size: 24px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        /* 2. AUJOURD'HUI (Active) */
        .reward-card.active {
            border: 3px solid var(--accent-gold);
            background: #fffdf0; /* Légère teinte jaune */
            transform: scale(1.02); /* Mise en avant */
            box-shadow: 0 10px 0 rgba(255, 179, 0, 0.2);
        }
        .reward-card.active .day-status {
            background: var(--accent-gold);
            color: var(--text-dark);
        }
        .claim-btn-small {
            background: var(--accent-gold);
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--text-dark);
            transition: 0.1s;
        }
        .claim-btn-small:active { transform: translateY(4px); box-shadow: 0 0 0 var(--text-dark); }

        /* 3. DISPO DEMAIN & BIENTÔT (Locked) */
        .reward-card.locked {
            background-color: var(--locked-gray);
        }
        .reward-card.locked .reward-icon,
        .reward-card.locked .reward-amount {
            opacity: 0.5;
            filter: grayscale(1);
        }
        .lock-icon {
            color: #bdc3c7;
            font-size: 22px;
        }

        /* Spécifique pour "Dispo Demain" */
        .reward-card.tomorrow .day-status {
            background: var(--primary-blue);
            color: white;
        }

        /* 4. GRAND PRIX (Jour 7) */
        .reward-card.grand-prize {
            height: 110px;
            background: linear-gradient(135deg, #fff 0%, #fff3cd 100%);
            border: 3px solid var(--accent-gold);
        }
        .reward-card.grand-prize .reward-icon {
            font-size: 45px;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- FOOTER --- */
        .footer {
            padding: 20px;
            background: var(--card-bg);
            border-top: 6px solid var(--text-dark);
        }
        .main-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-green);
            color: white;
            border: 3px solid var(--text-dark);
            border-radius: 25px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--text-dark);
            transition: 0.1s;
        }
        .main-btn:active { transform: translateY(6px); box-shadow: none; }

    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <div class="header">
            <h1>Cadeaux Quotidiens</h1>
            <p>Reviens chaque jour !</p>
        </div>

        <div class="reward-list">

            <div class="reward-card claimed">
                <div class="card-left">
                    <span class="day-title">Jour 1</span>
                    <span class="day-status">Récupéré</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-coins reward-icon" style="color: #f1c40f;"></i>
                    <span class="reward-amount">100</span>
                </div>
                <div class="card-state">
                    <i class="fa-solid fa-check check-icon"></i>
                </div>
            </div>

            <div class="reward-card active">
                <div class="card-left">
                    <span class="day-title">Jour 2</span>
                    <span class="day-status">Aujourd'hui</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-ticket reward-icon" style="color: #e74c3c;"></i>
                    <span class="reward-amount">x5</span>
                </div>
                <div class="card-state">
                    <button class="claim-btn-small">Prendre</button>
                </div>
            </div>

            <div class="reward-card locked tomorrow">
                <div class="card-left">
                    <span class="day-title">Jour 3</span>
                    <span class="day-status">Dispo Demain</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-gem reward-icon" style="color: #3498db;"></i>
                    <span class="reward-amount">25</span>
                </div>
                <div class="card-state">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

            <div class="reward-card locked">
                <div class="card-left">
                    <span class="day-title">Jour 4</span>
                    <span class="day-status">Bientôt</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-scroll reward-icon" style="color: #9b59b6;"></i>
                    <span class="reward-amount">Rare</span>
                </div>
                <div class="card-state">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

            <div class="reward-card locked">
                <div class="card-left">
                    <span class="day-title">Jour 5</span>
                    <span class="day-status">Bientôt</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-bolt reward-icon" style="color: #f39c12;"></i>
                    <span class="reward-amount">Énergie</span>
                </div>
                <div class="card-state">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

             <div class="reward-card locked">
                <div class="card-left">
                    <span class="day-title">Jour 6</span>
                    <span class="day-status">Bientôt</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-coins reward-icon" style="color: #f1c40f;"></i>
                    <span class="reward-amount">500</span>
                </div>
                <div class="card-state">
                    <i class="fa-solid fa-lock lock-icon"></i>
                </div>
            </div>

            <div class="reward-card locked grand-prize">
                <div class="card-left">
                    <span class="day-title" style="color:var(--accent-gold);">Jour 7</span>
                    <span class="day-status" style="background:var(--accent-gold); color:var(--text-dark);">Gros Lot</span>
                </div>
                <div class="card-reward">
                    <i class="fa-solid fa-gift reward-icon" style="color: var(--accent-gold);"></i>
                    <span class="reward-amount" style="color:var(--accent-gold);">Surprise</span>
                </div>
                <div class="card-state">
                    <i class="fa-solid fa-lock lock-icon" style="color:var(--accent-gold);"></i>
                </div>
            </div>

        </div>

        <div class="footer">
            <button class="main-btn">Continuer</button>
        </div>

    </div>

</body>
</html>
