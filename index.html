<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journey Reward Path</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #0b0e14;
            --path-glow: #00f2ff;
            --node-bg: #1a1f2b;
            --accent-pink: #ff0055;
            --accent-gold: #ffcc00;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg-deep);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            color: white;
            display: flex;
            justify-content: center;
        }

        /* --- BACKGROUND IMMERSIF --- */
        .world-bg {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1f2b3e 0%, #0b0e14 80%);
            z-index: 0;
        }
        /* Grille futuriste en fond */
        .grid-floor {
            position: absolute;
            bottom: -20%; left: -50%; width: 200%; height: 50%;
            background-image: linear-gradient(0deg, transparent 24%, rgba(0, 242, 255, .1) 25%, rgba(0, 242, 255, .1) 26%, transparent 27%, transparent 74%, rgba(0, 242, 255, .1) 75%, rgba(0, 242, 255, .1) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 242, 255, .1) 25%, rgba(0, 242, 255, .1) 26%, transparent 27%, transparent 74%, rgba(0, 242, 255, .1) 75%, rgba(0, 242, 255, .1) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            transform: perspective(300px) rotateX(60deg);
            opacity: 0.3;
        }

        /* --- UI CONTAINER --- */
        .game-ui {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(11,14,20,0.95) 0%, rgba(11,14,20,0) 100%);
            flex-shrink: 0;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--path-glow);
        }
        .subtitle {
            font-size: 14px;
            color: #8faab5;
            margin-top: 5px;
        }

        /* --- SCROLLABLE PATH AREA --- */
        .path-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 40px 0;
            /* Masquer scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .path-container::-webkit-scrollbar { display: none; }

        /* LIGNE CENTRALE (Le Sentier) */
        .timeline-line {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 4px;
            background: rgba(255,255,255,0.1);
            transform: translateX(-50%);
            z-index: 0;
        }
        /* La ligne de progression active */
        .timeline-progress {
            position: absolute;
            top: 0; /* Commence en haut (inversé ici pour l'effet visuel) */
            height: 75%; /* Simule la progression jusqu'au jour 2 */
            left: 50%;
            width: 4px;
            background: var(--path-glow);
            box-shadow: 0 0 15px var(--path-glow);
            transform: translateX(-50%);
            z-index: 0;
        }

        /* --- LES ÉTAPES (NODES) --- */
        .step-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px; /* Espace vertical entre les jours */
            position: relative;
        }

        /* Disposition en Zig-Zag (optionnelle, ici centrée pour mobile propre) */
        /* Pour un vrai zigzag, on utiliserait des marges alternées */

        .node {
            width: 80px;
            height: 80px;
            background: var(--node-bg);
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .node-label {
            position: absolute;
            left: -50px;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }
        
        .node:nth-child(even) .node-label {
            left: auto;
            right: -50px;
            text-align: right;
        }

        .reward-icon {
            font-size: 24px;
            color: white;
            margin-bottom: 5px;
        }
        .reward-amount {
            font-size: 16px;
            font-weight: 900;
        }

        /* --- ÉTATS DES NOEUDS --- */

        /* 1. COMPLÉTÉ */
        .node.completed {
            background: #0f3036;
            border-color: var(--path-glow);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }
        .node.completed .reward-icon { color: var(--path-glow); }

        /* 2. ACTUEL (Focus) */
        .node.current {
            transform: scale(1.2);
            background: radial-gradient(circle at 30% 30%, #2a3b55, #1a1f2b);
            border-color: white;
            box-shadow: 0 0 30px var(--path-glow), inset 0 0 20px rgba(0, 242, 255, 0.2);
            animation: floatNode 3s ease-in-out infinite;
        }
        .node.current::after {
            content: 'CLAIM';
            position: absolute;
            bottom: -30px;
            background: var(--accent-pink);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.5);
            animation: pulseBtn 1s infinite;
        }

        /* 3. VERROUILLÉ */
        .node.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }
        .node.locked .reward-icon { opacity: 0.5; }

        /* --- LE BOSS FINAL (Day 7) --- */
        .step-row.final {
            margin-bottom: 100px; /* Plus d'espace en bas */
        }
        .node.final-chest {
            width: 140px;
            height: 120px;
            background: linear-gradient(135deg, #2b1d00, #5c4100);
            border: 2px solid var(--accent-gold);
            border-radius: 30px;
            clip-path: polygon(50% 0%, 100% 15%, 100% 100%, 0 100%, 0 15%);
        }
        
        .glow-halo {
            position: absolute;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.2) 0%, transparent 70%);
            animation: rotateHalo 10s linear infinite;
            z-index: -1;
        }

        /* --- ANIMATIONS --- */
        @keyframes floatNode { 0%, 100% { transform: scale(1.2) translateY(0); } 50% { transform: scale(1.2) translateY(-10px); } }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes rotateHalo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- FOOTER ACTION --- */
        .footer-bar {
            padding: 20px;
            background: rgba(11,14,20,0.9);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
        }
        .main-btn {
            width: 100%;
            padding: 18px;
            border: none;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            border-radius: 12px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 114, 255, 0.4);
            transition: 0.2s;
        }
        .main-btn:active { transform: scale(0.98); opacity: 0.9; }

    </style>
</head>
<body>

    <div class="world-bg">
        <div class="grid-floor"></div>
    </div>

    <div class="game-ui">
        <div class="header">
            <h1>Daily Ascent</h1>
            <div class="subtitle">Reach the summit to claim the Relic</div>
        </div>

        <div class="path-container">
            <div class="timeline-line"></div>
            <div class="timeline-progress" style="height: 220px; bottom: 0; top: auto;"></div>

            <div class="step-row final">
                <div class="glow-halo"></div>
                <div class="node final-chest locked">
                    <span class="node-label" style="color:var(--accent-gold);">Day 7</span>
                    <i class="fa-solid fa-trophy" style="font-size: 40px; color: var(--accent-gold); margin-bottom:10px;"></i>
                    <div class="reward-amount" style="color: var(--accent-gold);">JACKPOT</div>
                </div>
            </div>

            <div class="step-row" style="margin-left: 60px;"> <div class="node locked">
                    <span class="node-label">Day 6</span>
                    <i class="fa-solid fa-gem reward-icon"></i>
                    <div class="reward-amount">x50</div>
                </div>
            </div>

            <div class="step-row" style="margin-right: 60px;"> <div class="node locked">
                    <span class="node-label">Day 5</span>
                    <i class="fa-solid fa-bolt reward-icon"></i>
                    <div class="reward-amount">x20</div>
                </div>
            </div>

            <div class="step-row"> <div class="node locked">
                    <span class="node-label">Day 4</span>
                    <i class="fa-solid fa-coins reward-icon"></i>
                    <div class="reward-amount">x1000</div>
                </div>
            </div>

            <div class="step-row" style="margin-left: 40px;">
                <div class="node current">
                    <span class="node-label" style="color:white; text-shadow:0 0 10px white;">Day 3</span>
                    <i class="fa-solid fa-box-open reward-icon" style="color: #00f2ff;"></i>
                    <div class="reward-amount">Mystery</div>
                </div>
            </div>

            <div class="step-row" style="margin-right: 40px;">
                <div class="node completed">
                    <span class="node-label">Day 2</span>
                    <i class="fa-solid fa-check reward-icon"></i>
                    <div class="reward-amount" style="opacity:0.5;">Claimed</div>
                </div>
            </div>

            <div class="step-row">
                <div class="node completed">
                    <span class="node-label">Day 1</span>
                    <i class="fa-solid fa-check reward-icon"></i>
                    <div class="reward-amount" style="opacity:0.5;">Claimed</div>
                </div>
            </div>

        </div>

        <div class="footer-bar">
            <button class="main-btn">Claim Day 3 Reward</button>
        </div>
    </div>

    <script>
        // Script simple pour scroller automatiquement vers le niveau actuel au chargement
        window.onload = function() {
            const current = document.querySelector('.node.current');
            if(current) {
                current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
