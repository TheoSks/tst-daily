<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCG Reward System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #10121b;
            --card-base: #1c1f2e;
            --rarity-common: #4aa8ff;
            --rarity-rare: #bd00ff;
            --rarity-legendary: linear-gradient(135deg, #ffd700, #ff8c00, #ff0055);
            --holo-sheen: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.2) 40%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.2) 60%, transparent 80%);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            /* Fond abstrait doux */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(74, 168, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(189, 0, 255, 0.1) 0%, transparent 40%);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* Pour la 3D */
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .ui-container {
            width: 100%;
            max-width: 390px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .season-badge {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .main-title {
            color: white;
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            line-height: 1.1;
        }
        .main-title span {
            display: block;
            font-size: 16px;
            font-weight: 300;
            color: #8890b5;
            margin-top: 5px;
        }

        /* --- GRID DE CARTES --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; /* Espace plus grand pour respirer */
            flex: 1;
        }

        /* --- DESIGN DE LA CARTE (Le cœur du rework) --- */
        .tcg-card {
            background: var(--card-base);
            border-radius: 12px;
            position: relative;
            height: 140px; /* Très vertical */
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Ombre portée douce */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            cursor: pointer;
        }

        /* Effet Hover: La carte se soulève */
        .tcg-card:hover {
            transform: translateY(-10px) scale(1.02);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Barre de Rareté (Haut) */
        .rarity-bar {
            height: 4px;
            width: 100%;
            background: var(--rarity-common);
            box-shadow: 0 0 10px var(--rarity-common);
        }

        /* Corps de la carte */
        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            z-index: 2;
        }

        .day-number {
            font-size: 10px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .reward-img {
            font-size: 32px;
            color: white;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .reward-value {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        /* Fond de carte avec motif subtil */
        .card-bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.03) 2px, transparent 2.5px);
            background-size: 10px 10px;
            z-index: 1;
        }

        /* --- ÉTATS --- */

        /* 1. CLAIMED (Carte grisée + Tampon) */
        .tcg-card.claimed {
            opacity: 0.5;
            filter: grayscale(0.8);
            transform: scale(0.95);
        }
        .tcg-card.claimed::after {
            content: '\f00c'; /* FontAwesome Check */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #fff;
            opacity: 0.8;
            z-index: 10;
        }

        /* 2. ACTIVE (Holographique) */
        .tcg-card.active {
            border: 1px solid rgba(255,255,255,0.5);
        }
        /* L'effet de brillance qui passe sur la carte */
        .tcg-card.active::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 200%; height: 100%;
            background: var(--holo-sheen);
            transform: skewX(-20deg) translateX(-150%);
            animation: holoSweep 3s infinite ease-in-out;
            pointer-events: none;
            z-index: 5;
        }
        .tcg-card.active .rarity-bar {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* Timer Badge flottant */
        .status-badge {
            position: absolute;
            bottom: 10px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 6;
        }

        /* 3. RARE (Day 3-6) */
        .tcg-card.rare .rarity-bar {
            background: var(--rarity-rare);
            box-shadow: 0 0 10px var(--rarity-rare);
        }

        /* --- LE BOOSTER PACK (Day 7) --- */
        .booster-pack-container {
            grid-column: span 3; /* Prend toute la largeur */
            margin-top: 10px;
            height: 120px;
        }

        .booster-pack {
            width: 100%;
            height: 100%;
            background: rgb(20,20,30);
            border-radius: 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            /* Texture foil alu froissé simulée */
            background: repeating-linear-gradient(
                45deg,
                #222,
                #222 10px,
                #2a2a2a 10px,
                #2a2a2a 20px
            );
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
            transition: 0.3s;
        }

        /* Effet Arc-en-ciel sur le booster */
        .booster-pack::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,0,0,0.2), rgba(255,255,0,0.2), rgba(0,255,0,0.2), rgba(0,0,255,0.2));
            mix-blend-mode: overlay;
        }

        .booster-info h3 {
            margin: 0;
            font-size: 24px;
            background: var(--rarity-legendary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .booster-info p {
            color: #888;
            font-size: 12px;
            margin: 5px 0 0 0;
        }

        .booster-art {
            font-size: 40px;
            color: white;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
            animation: shake 3s infinite ease-in-out; /* Le paquet bouge un peu */
            z-index: 2;
        }

        /* --- ANIMATIONS --- */
        @keyframes holoSweep { 0% { transform: skewX(-20deg) translateX(-150%); } 50%, 100% { transform: skewX(-20deg) translateX(150%); } }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }

        /* --- FOOTER --- */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div class="ui-container">
        <div class="header">
            <div class="season-badge">Season 4</div>
            <h1 class="main-title">
                Daily Drops
                <span>Collect rewards to build your deck</span>
            </h1>
        </div>

        <div class="card-grid">

            <div class="tcg-card claimed">
                <div class="rarity-bar"></div>
                <div class="card-bg-pattern"></div>
                <div class="card-body">
                    <div class="day-number">Day 01</div>
                    <i class="fa-solid fa-scroll reward-img"></i>
                    <div class="reward-value">XP Scroll</div>
                </div>
            </div>

            <div class="tcg-card active">
                <div class="rarity-bar"></div>
                <div class="card-bg-pattern"></div>
                <div class="card-body">
                    <div class="day-number" style="color:white;">Day 02</div>
                    <i class="fa-solid fa-diamond reward-img" style="color: #4aa8ff;"></i>
                    <div class="reward-value">50 Gems</div>
                    <div class="status-badge">CLAIM NOW</div>
                </div>
            </div>

            <div class="tcg-card rare">
                <div class="rarity-bar"></div>
                <div class="card-bg-pattern"></div>
                <div class="card-body">
                    <div class="day-number">Day 03</div>
                    <i class="fa-solid fa-flask reward-img" style="color: #bd00ff;"></i>
                    <div class="reward-value">Elixir</div>
                    <i class="fa-solid fa-lock" style="font-size:12px; opacity:0.3; margin-top:5px;"></i>
                </div>
            </div>

            <div class="tcg-card rare">
                <div class="rarity-bar"></div>
                <div class="card-bg-pattern"></div>
                <div class="card-body">
                    <div class="day-number">Day 04</div>
                    <i class="fa-solid fa-khanda reward-img" style="color: #bd00ff;"></i>
                    <div class="reward-value">Sword</div>
                    <i class="fa-solid fa-lock" style="font-size:12px; opacity:0.3; margin-top:5px;"></i>
                </div>
            </div>

            <div class="tcg-card rare">
                <div class="rarity-bar"></div>
                <div class="card-bg-pattern"></div>
                <div class="card-body">
                    <div class="day-number">Day 05</div>
                    <i class="fa-solid fa-shield-cat reward-img" style="color: #bd00ff;"></i>
                    <div class="reward-value">Shield</div>
                    <i class="fa-solid fa-lock" style="font-size:12px; opacity:0.3; margin-top:5px;"></i>
                </div>
            </div>

            <div class="tcg-card rare">
                <div class="rarity-bar"></div>
                <div class="card-bg-pattern"></div>
                <div class="card-body">
                    <div class="day-number">Day 06</div>
                    <i class="fa-solid fa-hat-wizard reward-img" style="color: #bd00ff;"></i>
                    <div class="reward-value">Skin</div>
                    <i class="fa-solid fa-lock" style="font-size:12px; opacity:0.3; margin-top:5px;"></i>
                </div>
            </div>

            <div class="booster-pack-container">
                <div class="booster-pack">
                    <div class="booster-info">
                        <h3>Legendary Pack</h3>
                        <p>Contains 1 guaranteed hero</p>
                    </div>
                    <i class="fa-solid fa-layer-group booster-art"></i>
                    
                    <i class="fa-solid fa-lock" style="position:absolute; top:15px; right:15px; color:#555;"></i>
                </div>
            </div>

        </div>

        <div class="footer-text">Resets in 6 days 14 hours</div>
    </div>

</body>
</html>
