<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rewards Perfect Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Fredoka', sans-serif;
            --color-bg-deep: #1a0b36;
            --color-bg-light: #2c3e85;
            --card-header-bg: #dad1ff;
            --card-body-bg-top: #fbf9ff;
            --card-body-bg-bot: #dcd2ff;
            --color-green: #56e32d;
            --color-cyan: #00eaff;
            --color-purple-dark: #4a2c85;
            --stroke-color: #6d5b9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--color-bg-deep);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- BACKGROUND COMPLEXE (CERCLES) --- */
        .app-container {
            width: 100%;
            max-width: 414px; /* Largeur iPhone Max */
            height: 100vh; /* Plein écran mobile */
            max-height: 850px;
            background: 
                radial-gradient(circle at 50% 35%, rgba(68, 86, 184, 0.4) 0%, transparent 50%),
                repeating-radial-gradient(circle at 50% 35%, transparent 0, transparent 40px, rgba(50, 60, 120, 0.1) 41px, rgba(50, 60, 120, 0.1) 60px),
                linear-gradient(180deg, #181945 0%, #291852 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* --- HEADER & RIBBON --- */
        .header-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        .ribbon-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            filter: drop-shadow(0 8px 0 rgba(0,0,0,0.2));
            margin-bottom: 5px;
        }

        .ribbon-body {
            background: linear-gradient(180deg, #4ffaff 0%, #00b8d4 50%, #009eb8 100%);
            padding: 12px 60px;
            border-radius: 8px 8px 40px 40px; /* Courbe vers le bas */
            position: relative;
            z-index: 2;
            clip-path: path("M0,0 H280 Q290,20 280,50 Q140,65 0,50 Q-10,20 0,0 Z"); /* Forme SVG personnalisée simulée */
            width: 320px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ribbon-text {
            color: white;
            font-size: 26px;
            font-weight: 800;
            text-shadow: 0 2px 0 #006064, 0 3px 5px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            margin-top: -5px;
        }
        
        .ribbon-tail-left, .ribbon-tail-right {
            position: absolute;
            top: 10px;
            width: 40px;
            height: 40px;
            background: #007c91;
            z-index: 1;
            border-radius: 5px;
        }
        .ribbon-tail-left { left: 20px; transform: rotate(-20deg); }
        .ribbon-tail-right { right: 20px; transform: rotate(20deg); }

        /* Bouton X de fermeture */
        .close-btn {
            position: absolute;
            right: 40px;
            top: 15px;
            font-weight: bold;
            color: #1a3b6e;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        /* --- TIMER --- */
        .timer-label {
            color: white;
            font-size: 14px;
            font-style: italic;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 0 2px 2px rgba(0,0,0,0.8);
        }

        .timer-pill {
            background: linear-gradient(180deg, #dccfff 0%, #9e8eff 100%);
            padding: 4px 16px;
            border-radius: 20px;
            border: 2px solid white;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .timer-text {
            color: #553c8b;
            font-weight: 800;
            font-size: 15px;
            font-style: italic;
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 95%;
            position: relative;
            height: 80px; /* Espace pour les coffres */
            margin-bottom: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 10px;
        }

        /* La barre bleue derrière */
        .progress-track {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 10px;
            height: 14px;
            background: #416096;
            border-radius: 10px;
            border: 2px solid #5d7cb3;
            z-index: 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* La barre jaune de progression */
        .progress-fill {
            position: absolute;
            bottom: 15px;
            left: 12px;
            height: 10px; /* Plus petit pour rentrer dans la track */
            width: 18%; /* Ajuster la progression ici */
            background: linear-gradient(90deg, #ffd900, #ffae00);
            border-radius: 10px;
            z-index: 1;
            box-shadow: 0 0 5px #ffae00;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 40px;
        }

        .step-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #6c4bc4;
            border: 2px solid #bba6f2;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }

        /* État "Completed" (Coche verte) */
        .step.completed .step-circle {
            background: linear-gradient(180deg, #7aff6e, #1ba611);
            border-color: white;
            color: #00520a;
            font-size: 18px;
        }

        /* Les Icônes Coffres (Placeholders) */
        .chest-img {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
            /* PLACEHOLDER VISUEL : Emoji pour simuler l'image 3D */
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }

        /* --- GRID DAYS --- */
        .days-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .card {
            background: linear-gradient(180deg, var(--card-body-bg-top) 0%, var(--card-body-bg-bot) 100%);
            border-radius: 18px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            border: 3px solid white;
            box-shadow: 0 6px 0 #7e6bb5, 0 10px 10px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden; /* Important pour le bandeau "Claimed" */
        }

        .card-header {
            background: var(--card-header-bg);
            border-radius: 12px 12px 6px 6px;
            text-align: center;
            padding: 4px 0;
            color: var(--stroke-color);
            font-weight: 800;
            font-size: 13px;
            font-style: italic;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px 0 10px 0;
            min-height: 80px;
        }

        /* Style des textes (quantités) */
        .amount-text {
            font-weight: 900;
            font-size: 18px;
            color: white;
            -webkit-text-stroke: 1.5px #cf9900; /* Contour jaune/or */
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            font-style: italic;
        }
        .amount-text.blue { -webkit-text-stroke: 1.5px #3a7caf; }

        /* --- CARD VARIANTS --- */

        /* Day 1: Claimed */
        .card.claimed {
            filter: grayscale(100%); /* Rend tout gris */
            opacity: 0.9;
        }
        .card.claimed::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.1);
        }
        .banner-claimed {
            position: absolute;
            background: #66ff75;
            color: #005c1d;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            padding: 5px 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
            border: 2px solid white;
            white-space: nowrap;
        }

        /* Day 2: Today (Active) */
        .card.today {
            border: 3px solid #5aff6c;
            background: radial-gradient(circle, #bfaaff 0%, #8e74ff 100%);
            box-shadow: 0 0 15px rgba(90, 255, 108, 0.6), 0 6px 0 #5c43a3;
            transform: scale(1.02);
            z-index: 5;
        }
        .card.today .card-header {
            background: #5aff6c;
            color: #006813;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .card.today .card-body {
            /* Effet de glow derrière les pièces */
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
        }

        /* --- DAY 7 (LARGE) --- */
        .day-7-wrapper {
            width: 100%;
            margin-top: 5px;
        }
        
        .card-day7 {
            width: 100%;
            background: linear-gradient(180deg, #3d51a6 0%, #20134d 100%);
            border: 3px solid white;
            border-radius: 20px;
            box-shadow: inset 0 0 20px #5e84ff, 0 6px 0 #150b33;
            overflow: hidden;
        }

        .day7-header {
            text-align: center;
            background: linear-gradient(180deg, #e4dcff 0%, #b7abeb 100%);
            padding: 5px;
            color: #554488;
            font-weight: 800;
            font-size: 14px;
            font-style: italic;
        }

        .day7-content {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 10px 10px 15px 10px;
            background-image: radial-gradient(white 1px, transparent 1px); /* Étoiles */
            background-size: 20px 20px;
        }

        .reward-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- PLACEHOLDER ICONS (To be replaced by images) --- */
        .icon { font-size: 32px; margin-bottom: -5px; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2)); }
        .icon-lg { font-size: 42px; margin-bottom: -5px; filter: drop-shadow(0 0 10px white); }
        .icon-coins { color: #ffd700; }
        .icon-glass { color: #00d9ff; }
        .icon-box { color: #aa00ff; }

    </style>
</head>
<body>

    <div class="app-container">

        <div class="header-section">
            <div class="ribbon-wrapper">
                <div class="ribbon-tail-left"></div>
                <div class="ribbon-tail-right"></div>
                <div class="ribbon-body">
                    <span class="ribbon-text">Daily Rewards</span>
                    <span class="close-btn">✖</span>
                </div>
            </div>
            
            <div class="timer-label">Expires in:</div>
            <div class="timer-pill">
                <span>⏱️</span>
                <span class="timer-text">8h 59m 30s</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-track"></div>
            <div class="progress-fill"></div>

            <div class="step completed">
                <div class="chest-img">📦</div> <div class="step-circle">✓</div>
            </div>

            <div class="step">
                <div class="chest-img">🎁</div> <div class="step-circle">15</div>
            </div>

            <div class="step">
                <div class="chest-img">🎁</div> <div class="step-circle">22</div>
            </div>

            <div class="step">
                <div class="chest-img">🎁</div> <div class="step-circle">28</div>
            </div>
        </div>

        <div class="days-grid">
            
            <div class="card claimed">
                <div class="banner-claimed">Claimed</div>
                <div class="card-header">Day 1</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    </div>
            </div>

            <div class="card today">
                <div class="card-header">Today</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    <div class="amount-text">x500</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 3</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    <div class="amount-text">x500</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 4</div>
                <div class="card-body">
                    <div class="icon icon-glass">⏳</div>
                    <div class="amount-text blue">+10s</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 5</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    <div class="amount-text">x800</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 6</div>
                <div class="card-body">
                    <div class="icon icon-glass">⏳</div>
                    <div class="amount-text blue">+30s</div>
                </div>
            </div>
        </div>

        <div class="day-7-wrapper">
            <div class="card-day7">
                <div class="day7-header">Day 7</div>
                <div class="day7-content">
                    <div class="reward-group">
                        <div class="icon icon-coins">🪙</div>
                        <div class="amount-text">x1,000</div>
                    </div>
                    <div class="reward-group">
                        <div class="icon-lg icon-box">🟪</div> <div class="amount-text">x2</div>
                    </div>
                    <div class="reward-group">
                        <div class="icon icon-glass">⏳</div>
                        <div class="amount-text blue">+2m</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
