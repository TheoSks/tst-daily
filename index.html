<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Daily Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #007aff; /* Bleu système standard */
            --success: #34c759;
            --text-main: #1c1c1e;
            --text-sec: #8e8e93;
            --bg-app: #f2f2f7;
            --card-bg: #ffffff;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- MOBILE CONTAINER --- */
        .mobile-frame {
            width: 100%;
            max-width: 400px;
            height: 95vh;
            max-height: 850px;
            background-color: var(--bg-app);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- HEADER --- */
        .header {
            padding: 25px 20px 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .close-icon {
            font-size: 20px;
            color: var(--text-sec);
            cursor: pointer;
            padding: 5px;
        }

        /* --- LISTE --- */
        .reward-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- CARTE ROW --- */
        .reward-item {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border: 1px solid transparent;
            transition: 0.2s;
        }

        /* Partie Gauche : Icone + Texte */
        .item-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Cercle du jour (Day Circle) */
        .day-circle {
            width: 40px;
            height: 40px;
            background-color: #f0f0f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sec);
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .reward-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }
        .reward-sub {
            font-size: 12px;
            color: var(--text-sec);
        }

        /* Partie Droite : Statut */
        .item-status {
            font-size: 14px;
        }

        /* --- ÉTATS --- */

        /* 1. COMPLÉTÉ */
        .reward-item.completed {
            opacity: 0.7;
        }
        .reward-item.completed .day-circle {
            background-color: rgba(52, 199, 89, 0.1);
            color: var(--success);
        }
        .icon-check {
            color: var(--success);
            font-size: 18px;
        }

        /* 2. ACTIF (Focus) */
        .reward-item.active {
            border: 1px solid var(--primary);
            background-color: #f5f9ff;
        }
        .reward-item.active .day-circle {
            background-color: var(--primary);
            color: white;
        }
        .btn-claim-small {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 3. VERROUILLÉ */
        .reward-item.locked .day-circle {
            background-color: #f9f9f9;
            color: #d1d1d6;
        }
        .reward-item.locked .reward-name {
            color: var(--text-sec);
        }
        .icon-lock {
            color: #d1d1d6;
            font-size: 16px;
        }

        /* 4. GRAND PRIX (Day 7) */
        .reward-item.grand-prize {
            background: linear-gradient(135deg, #fff 0%, #fff9e6 100%);
            border: 1px solid #ffcc00;
        }
        .reward-item.grand-prize .day-circle {
            background-color: #ffcc00;
            color: #fff;
        }

        /* --- FOOTER --- */
        .footer {
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-main:hover {
            background-color: #0062cc;
        }

    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <div class="header">
            <h1>Récompenses</h1>
            <i class="fa-solid fa-xmark close-icon"></i>
        </div>

        <div class="reward-list">

            <div class="reward-item completed">
                <div class="item-left">
                    <div class="day-circle"><i class="fa-solid fa-check"></i></div>
                    <div class="item-info">
                        <span class="reward-name">100 Pièces</span>
                        <span class="reward-sub">Jour 1</span>
                    </div>
                </div>
                <div class="item-status">
                    <i class="fa-solid fa-check icon-check"></i>
                </div>
            </div>

            <div class="reward-item active">
                <div class="item-left">
                    <div class="day-circle">J2</div>
                    <div class="item-info">
                        <span class="reward-name">25 Gemmes</span>
                        <span class="reward-sub">Aujourd'hui</span>
                    </div>
                </div>
                <div class="item-status">
                    <button class="btn-claim-small">Récupérer</button>
                </div>
            </div>

            <div class="reward-item locked">
                <div class="item-left">
                    <div class="day-circle">J3</div>
                    <div class="item-info">
                        <span class="reward-name">Coffre Argent</span>
                        <span class="reward-sub">Demain</span>
                    </div>
                </div>
                <div class="item-status">
                    <i class="fa-solid fa-lock icon-lock"></i>
                </div>
            </div>

            <div class="reward-item locked">
                <div class="item-left">
                    <div class="day-circle">J4</div>
                    <div class="item-info">
                        <span class="reward-name">50 Gemmes</span>
                        <span class="reward-sub">Dans 2 jours</span>
                    </div>
                </div>
                <div class="item-status">
                    <i class="fa-solid fa-lock icon-lock"></i>
                </div>
            </div>

            <div class="reward-item locked">
                <div class="item-left">
                    <div class="day-circle">J5</div>
                    <div class="item-info">
                        <span class="reward-name">Booster XP</span>
                        <span class="reward-sub">Dans 3 jours</span>
                    </div>
                </div>
                <div class="item-status">
                    <i class="fa-solid fa-lock icon-lock"></i>
                </div>
            </div>

            <div class="reward-item locked">
                <div class="item-left">
                    <div class="day-circle">J6</div>
                    <div class="item-info">
                        <span class="reward-name">500 Pièces</span>
                        <span class="reward-sub">Dans 4 jours</span>
                    </div>
                </div>
                <div class="item-status">
                    <i class="fa-solid fa-lock icon-lock"></i>
                </div>
            </div>

            <div class="reward-item grand-prize">
                <div class="item-left">
                    <div class="day-circle"><i class="fa-solid fa-star"></i></div>
                    <div class="item-info">
                        <span class="reward-name">Coffre Légendaire</span>
                        <span class="reward-sub">Récompense finale</span>
                    </div>
                </div>
                <div class="item-status">
                    <i class="fa-solid fa-gift" style="color:#ffcc00; font-size: 20px;"></i>
                </div>
            </div>

        </div>

        <div class="footer">
            <button class="btn-main">Continuer</button>
        </div>

    </div>

</body>
</html>
