<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rewards Perfect Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Fredoka', sans-serif;
            --color-bg-deep: #1a0b36;
            --color-bg-light: #2c3e85;
            --card-header-bg: #dad1ff;
            --card-body-bg-top: #fbf9ff;
            --card-body-bg-bot: #dcd2ff;
            --color-green: #56e32d;
            
            /* Couleurs spécifiques Header/Ribbon */
            --cyan-light: #4ffaff;
            --cyan-main: #00dcea;
            --cyan-shadow: #007c91;
            --text-shadow: #0a5f68;
            --timer-bg-top: #ece5ff;
            --timer-bg-bot: #b4a6e0;
            --timer-border: #ffffff;
            --rivet-color: #aebcd1;
            --stroke-color: #6d5b9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--color-bg-deep);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- CONTAINER PRINCIPAL AVEC NOUVEAU BACKGROUND --- */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 850px;
            
            /* BACKGROUND INTÉGRÉ ICI */
            background-color: #1a0b36;
            background-image: 
                /* 1. Lumière centrale (Glow) */
                radial-gradient(circle at 50% 30%, rgba(79, 94, 184, 0.3) 0%, transparent 60%),
                
                /* 2. Les cercles concentriques (Effet Tunnel) */
                repeating-radial-gradient(
                    circle at 50% 40%, 
                    transparent 0, 
                    transparent 40px, 
                    rgba(255, 255, 255, 0.04) 41px, 
                    rgba(255, 255, 255, 0.04) 80px
                ),
                
                /* 3. Dégradé de fond sombre global */
                linear-gradient(180deg, #251852 0%, #120829 100%);
                
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* --- NOUVEAU HEADER (RIBBON + TIMER MECANIQUE) --- */
        .header-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        /* 1. Le Ruban Courbé */
        .ribbon-container {
            position: relative;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .ribbon-main {
            background: linear-gradient(180deg, var(--cyan-light) 0%, var(--cyan-main) 100%);
            width: 320px;
            height: 65px;
            position: relative;
            z-index: 2;
            /* Astuce pour la courbe : border-radius différentiel */
            border-radius: 50% 50% 10% 10% / 15% 15% 10% 10%; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        /* Les bouts du ruban pliés derrière */
        .ribbon-back-left, .ribbon-back-right {
            position: absolute;
            top: 15px;
            width: 50px;
            height: 40px;
            background: var(--cyan-shadow);
            z-index: 1;
            border-radius: 5px;
        }
        .ribbon-back-left { left: 15px; transform: rotate(-15deg); }
        .ribbon-back-right { right: 15px; transform: rotate(15deg); }

        .ribbon-title {
            color: white;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            text-shadow: 0px 3px 0px var(--text-shadow);
            letter-spacing: 0.5px;
            padding-top: 5px; 
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #0f4c5c;
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            text-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }

        /* Étoiles brillantes */
        .star { position: absolute; color: white; animation: sparkle 2s infinite; }
        .s1 { top: -5px; left: 60px; font-size: 14px; }
        .s2 { top: 0px; right: 50px; font-size: 20px; }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* 2. Le Timer Mécanique */
        .timer-section {
            margin-top: 5px;
            text-align: center;
            position: relative;
            z-index: 5; 
        }

        .timer-label {
            color: white;
            font-style: italic;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: -6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }

        .timer-plate {
            background: linear-gradient(180deg, var(--timer-bg-top) 0%, var(--timer-bg-bot) 100%);
            border: 3px solid var(--timer-border);
            border-radius: 30px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 220px;
            height: 45px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            position: relative;
        }

        .timer-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .clock-icon { font-size: 20px; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.2)); }
        .time-text { color: #4a3b75; font-weight: 800; font-style: italic; font-size: 18px; }

        .rivet {
            width: 8px;
            height: 8px;
            background: var(--rivet-color);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px white, inset -1px -1px 2px rgba(0,0,0,0.3);
            border: 1px solid #8e8eb4;
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 95%;
            position: relative;
            height: 80px; 
            margin-bottom: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 10px;
        }

        .progress-track {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 10px;
            height: 14px;
            background: #416096;
            border-radius: 10px;
            border: 2px solid #5d7cb3;
            z-index: 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .progress-fill {
            position: absolute;
            bottom: 15px;
            left: 12px;
            height: 10px; 
            width: 18%; 
            background: linear-gradient(90deg, #ffd900, #ffae00);
            border-radius: 10px;
            z-index: 1;
            box-shadow: 0 0 5px #ffae00;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 40px;
        }

        .step-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #6c4bc4;
            border: 2px solid #bba6f2;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }

        .step.completed .step-circle {
            background: linear-gradient(180deg, #7aff6e, #1ba611);
            border-color: white;
            color: #00520a;
            font-size: 18px;
        }

        .chest-img {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }

        /* --- GRID DAYS --- */
        .days-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .card {
            background: linear-gradient(180deg, var(--card-body-bg-top) 0%, var(--card-body-bg-bot) 100%);
            border-radius: 18px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            border: 3px solid white;
            box-shadow: 0 6px 0 #7e6bb5, 0 10px 10px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden; 
        }

        .card-header {
            background: var(--card-header-bg);
            border-radius: 12px 12px 6px 6px;
            text-align: center;
            padding: 4px 0;
            color: var(--stroke-color);
            font-weight: 800;
            font-size: 13px;
            font-style: italic;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px 0 10px 0;
            min-height: 80px;
        }

        .amount-text {
            font-weight: 900;
            font-size: 18px;
            color: white;
            -webkit-text-stroke: 1.5px #cf9900; 
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            font-style: italic;
        }
        .amount-text.blue { -webkit-text-stroke: 1.5px #3a7caf; }

        /* Day 1: Claimed */
        .card.claimed { filter: grayscale(100%); opacity: 0.9; }
        .card.claimed::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.1);
        }
        .banner-claimed {
            position: absolute;
            background: #66ff75;
            color: #005c1d;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            padding: 5px 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
            border: 2px solid white;
            white-space: nowrap;
        }

        /* Day 2: Today */
        .card.today {
            border: 3px solid #5aff6c;
            background: radial-gradient(circle, #bfaaff 0%, #8e74ff 100%);
            box-shadow: 0 0 15px rgba(90, 255, 108, 0.6), 0 6px 0 #5c43a3;
            transform: scale(1.02);
            z-index: 5;
        }
        .card.today .card-header {
            background: #5aff6c;
            color: #006813;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .card.today .card-body {
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
        }

        /* --- DAY 7 (LARGE) --- */
        .day-7-wrapper { width: 100%; margin-top: 5px; }
        
        .card-day7 {
            width: 100%;
            background: linear-gradient(180deg, #3d51a6 0%, #20134d 100%);
            border: 3px solid white;
            border-radius: 20px;
            box-shadow: inset 0 0 20px #5e84ff, 0 6px 0 #150b33;
            overflow: hidden;
        }

        .day7-header {
            text-align: center;
            background: linear-gradient(180deg, #e4dcff 0%, #b7abeb 100%);
            padding: 5px;
            color: #554488;
            font-weight: 800;
            font-size: 14px;
            font-style: italic;
        }

        .day7-content {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 10px 10px 15px 10px;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .reward-group { display: flex; flex-direction: column; align-items: center; }

        /* Placeholders Icons */
        .icon { font-size: 32px; margin-bottom: -5px; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2)); }
        .icon-lg { font-size: 42px; margin-bottom: -5px; filter: drop-shadow(0 0 10px white); }
        .icon-coins { color: #ffd700; }
        .icon-glass { color: #00d9ff; }
        .icon-box { color: #aa00ff; }

    </style>
</head>
<body>

    <div class="app-container">

        <div class="header-section">
            <div class="ribbon-container">
                <div class="ribbon-back-left"></div>
                <div class="ribbon-back-right"></div>
                <div class="ribbon-main">
                    <h1 class="ribbon-title">Daily Rewards</h1>
                    <button class="close-btn">✖</button>
                </div>
                <div class="star s1">✦</div>
                <div class="star s2">✦</div>
            </div>
        
            <div class="timer-section">
                <div class="timer-label">Expires in:</div>
                <div class="timer-plate">
                    <div class="rivet left"></div>
                    <div class="timer-content">
                        <span class="clock-icon">⏱️</span>
                        <span class="time-text">8h 59m 30s</span>
                    </div>
                    <div class="rivet right"></div>
                </div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-track"></div>
            <div class="progress-fill"></div>

            <div class="step completed">
                <div class="chest-img">📦</div> 
                <div class="step-circle">✓</div>
            </div>

            <div class="step">
                <div class="chest-img">🎁</div> 
                <div class="step-circle">15</div>
            </div>

            <div class="step">
                <div class="chest-img">🎁</div> 
                <div class="step-circle">22</div>
            </div>

            <div class="step">
                <div class="chest-img">🎁</div> 
                <div class="step-circle">28</div>
            </div>
        </div>

        <div class="days-grid">
            
            <div class="card claimed">
                <div class="banner-claimed">Claimed</div>
                <div class="card-header">Day 1</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                </div>
            </div>

            <div class="card today">
                <div class="card-header">Today</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    <div class="amount-text">x500</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 3</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    <div class="amount-text">x500</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 4</div>
                <div class="card-body">
                    <div class="icon icon-glass">⏳</div>
                    <div class="amount-text blue">+10s</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 5</div>
                <div class="card-body">
                    <div class="icon icon-coins">🪙</div>
                    <div class="amount-text">x800</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Day 6</div>
                <div class="card-body">
                    <div class="icon icon-glass">⏳</div>
                    <div class="amount-text blue">+30s</div>
                </div>
            </div>
        </div>

        <div class="day-7-wrapper">
            <div class="card-day7">
                <div class="day7-header">Day 7</div>
                <div class="day7-content">
                    <div class="reward-group">
                        <div class="icon icon-coins">🪙</div>
                        <div class="amount-text">x1,000</div>
                    </div>
                    <div class="reward-group">
                        <div class="icon-lg icon-box">🟪</div> 
                        <div class="amount-text">x2</div>
                    </div>
                    <div class="reward-group">
                        <div class="icon icon-glass">⏳</div>
                        <div class="amount-text blue">+2m</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
